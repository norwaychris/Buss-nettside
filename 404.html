<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fant ikke siden | NorwayRob</title>
  <meta name="description" content="Denne siden finnes ikke. Gå til forsiden for å leie buss med sjåfør i Bergen — utdrikningslag, fadderuke, blåtur og firmatur." />
  <!-- Ingen canonical med vilje: adressen her varierer med hva som ble skrevet
       feil, og en canonical mot forsiden ville fortalt Google at en vilkårlig
       feiladresse ER forsiden. noindex er det riktige signalet alene. -->
  <meta name="robots" content="noindex" />
  <!-- OG-tagger fordi brutte lenker faktisk blir delt. Uten dem blir
       forhåndsvisningen i Messenger og Slack helt blank. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="NorwayRob" />
  <meta property="og:url" content="https://norwayrob.no/" />
  <meta property="og:title" content="Fant ikke siden – NorwayRob" />
  <meta property="og:description" content="Denne holdeplassen finnes ikke, men bussen går fortsatt. Buss til leie med sjåfør i Bergen." />
  <meta property="og:image" content="https://norwayrob.no/images/hero.jpg" />
  <meta name="theme-color" content="#0a0a0b" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- Skriftene ligger nå på vårt eget domene (se fonts/LES-MEG.md).
       @font-face står i styles.css, som selv blokkerer visningen – uten
       preload ville nedlastingen ikke starte før CSS-en var framme. Disse
       tre er de eneste som brukes over skjermkanten. -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/anton-400.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-400.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-700.woff2" crossorigin />
  <link rel="stylesheet" href="/styles.css?v=33" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="/" class="brand" aria-label="NorwayRob – til forsiden">
        <span class="brand-name">NORWAY<span class="brand-accent">ROB</span></span>
        <span class="brand-sub">Buss til leie · Bergen</span>
      </a>
      <a href="/#booking" class="btn btn-primary btn-sm">Få pris</a>
    </div>
  </header>
  <main style="min-height:60vh;display:flex;align-items:center;">
    <div class="wrap" style="text-align:center;padding:80px 24px;">
      <p class="eyebrow">404</p>
      <h1 style="font-family:var(--display);font-size:clamp(40px,7vw,72px);text-transform:uppercase;line-height:1;margin:0 0 18px;">Denne holdeplassen<br /><span style="color:var(--red);">finnes ikke.</span></h1>
      <p style="color:var(--muted);max-width:44ch;margin:0 auto 30px;">Siden du leter etter er flyttet eller finnes ikke. Men bussen går fortsatt — hopp på her:</p>
      <a href="/" class="btn btn-primary btn-lg">Til forsiden</a>
    </div>
  </main>
</body>
</html>
